services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inko
      POSTGRES_USER: inko_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inko_app_dev_pwd}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      INKO_DB_URL: jdbc:postgresql://postgres:5432/inko
      INKO_DB_USER: inko_app
      INKO_DB_PASSWORD: ${POSTGRES_PASSWORD:-inko_app_dev_pwd}
      INKO_JWT_SECRET: ${INKO_JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789abcdef}
      PAYMENT_PROVIDER: mock
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
