spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.inko: INFO
    org.hibernate.SQL: WARN

inko:
  app:
    jwt:
      secret: ${INKO_JWT_SECRET}
    cors:
      allowed-origins: ${INKO_APP_CORS_ALLOWEDORIGINS}
    dev-mode: false
    seed-dev-data: false
